name: Deploy Backend

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GATEWAY_HEALTH_URL: ${{ secrets.GATEWAY_HEALTH_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH,DEPLOY_COMMIT,GATEWAY_HEALTH_URL
          script_stop: true
          script: |
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git reset --hard "$DEPLOY_COMMIT"
            docker compose build
            docker compose up -d --remove-orphans
            docker image prune -f

            if [ -n "$GATEWAY_HEALTH_URL" ]; then
              curl --fail --silent --show-error --retry 10 --retry-delay 5 "$GATEWAY_HEALTH_URL"
            fi
