name: Deploy Backend

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    environment:
      name: production
      url: https://uavpms.ddns.net/swagger/index.html

    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GATEWAY_HEALTH_URL: ${{ secrets.GATEWAY_HEALTH_URL }}
          SMOKE_API_URL: ${{ secrets.SMOKE_API_URL || 'https://uavpms.ddns.net' }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_OTP: ${{ secrets.SMOKE_OTP }}
          SMOKE_MISSION_ID: ${{ secrets.SMOKE_MISSION_ID }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          debug: true
          timeout: 30s
          command_timeout: 30m

          envs: DEPLOY_PATH,DEPLOY_COMMIT,GATEWAY_HEALTH_URL,SMOKE_API_URL,SMOKE_EMAIL,SMOKE_PASSWORD,SMOKE_OTP,SMOKE_MISSION_ID

          script_stop: true

          script: |
            set -e

            cd "$DEPLOY_PATH"

            echo "Fetching latest repository state..."
            git fetch origin main

            echo "Checking out main..."
            git checkout main

            echo "Deploying commit: $DEPLOY_COMMIT"
            git reset --hard "$DEPLOY_COMMIT"

            echo "Building containers..."
            docker compose build

            echo "Applying database schema adjustments..."
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'ALTER TABLE "AuditLogs" ALTER COLUMN "ActionType" TYPE character varying(100);' || true

            echo "Starting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Cleaning Docker build cache older than 3 days..."
            docker builder prune -af --filter "until=72h"

            if [ -n "$GATEWAY_HEALTH_URL" ]; then
              echo "Running health check..."
              curl \
                --fail \
                --silent \
                --show-error \
                --retry 10 \
                --retry-delay 5 \
                "$GATEWAY_HEALTH_URL"

              echo "Health check passed."
            fi

            echo "Checking AI pipeline configuration..."
            bash scripts/ops/check_production.sh

            if [ -n "$SMOKE_EMAIL" ] && [ -n "$SMOKE_PASSWORD" ] && [ -n "$SMOKE_MISSION_ID" ]; then
              echo "Running AI end-to-end smoke test..."
              bash scripts/ops/smoke_ai_flow.sh
            else
              echo "SMOKE_* secrets not set; skipping AI smoke test."
            fi
