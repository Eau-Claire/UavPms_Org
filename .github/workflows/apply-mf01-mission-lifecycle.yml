name: Apply MF01 Mission Lifecycle Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_MF01_MISSION_LIFECYCLE to apply and verify the MF01 OperationsService migration.
        required: true
        type: string

concurrency:
  group: production-operations-database-update
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify MF01 migration
    if: ${{ inputs.confirmation == 'APPLY_MF01_MISSION_LIFECYCLE' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Apply MF01 migration over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            MIGRATION_ID="20260909130000_AddMf01MissionLifecycle"
            MIGRATION_FILE="Services/OperationsService/UavPms.OperationsService.Infrastructure/Migrations/${MIGRATION_ID}.cs"

            echo "========== MF01 MIGRATION PREFLIGHT =========="
            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "ERROR: DEPLOY_PATH is not configured."
              exit 1
            fi

            cd "$DEPLOY_PATH"
            echo "Deployment path: $DEPLOY_PATH"
            echo "Commit: $(git rev-parse HEAD)"

            migration_mode_started=false
            restore_normal_mode() {
              if [ "$migration_mode_started" = "true" ]; then
                echo "Restoring RUN_MIGRATIONS=false after migration attempt..."
                RUN_MIGRATIONS=false docker compose up -d --force-recreate operationsservice || true
              fi
            }
            trap restore_normal_mode EXIT

            CURRENT_BRANCH="$(git branch --show-current)"
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: deployment checkout must be on main; found '$CURRENT_BRANCH'."
              exit 1
            fi

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: deployment checkout has tracked changes."
              git status --short --untracked-files=no
              exit 1
            fi

            if [ ! -f "$MIGRATION_FILE" ]; then
              echo "ERROR: deployed commit does not contain $MIGRATION_FILE. Deploy the MF01 code first."
              exit 1
            fi

            DB_STATUS="$(docker inspect uavpms-db --format '{{.State.Status}}')"
            if [ "$DB_STATUS" != "running" ]; then
              echo "ERROR: uavpms-db is not running (status: $DB_STATUS)."
              exit 1
            fi

            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc 'SELECT 1;' >/dev/null

            db_scalar() {
              docker exec uavpms-db psql -X -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc "$1"
            }
            migration_applied() {
              db_scalar "SELECT EXISTS (SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$1');"
            }
            record_existing_migration() {
              local migration_id="$1"
              echo "Schema for $migration_id is complete; reconciling EF migration history."
              docker exec uavpms-db psql -X -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c \
                "INSERT INTO \"__EFMigrationsHistory\" (\"MigrationId\", \"ProductVersion\") SELECT '$migration_id', COALESCE((SELECT \"ProductVersion\" FROM \"__EFMigrationsHistory\" ORDER BY \"MigrationId\" DESC LIMIT 1), '9.0.16') WHERE NOT EXISTS (SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$migration_id');"
            }

            echo "========== PREREQUISITE MIGRATION RECONCILIATION =========="
            GIS_MIGRATION_ID="20260902033000_AddGisAssetSelection"
            if [ "$(migration_applied "$GIS_MIGRATION_ID")" != "t" ]; then
              GIS_TABLE_COUNT="$(db_scalar "SELECT count(*) FROM (VALUES ('ManagementUnits'),('AssetComponents'),('LineSegments')) AS expected(name) WHERE to_regclass('public.\"' || name || '\"') IS NOT NULL;")"
              GIS_COLUMN_COUNT="$(db_scalar "SELECT count(*) FROM (VALUES ('Regions','Code'),('Regions','Type'),('Regions','ParentId'),('TransmissionLines','Code'),('TransmissionLines','VoltageLevel'),('TransmissionLines','ManagementUnitId'),('TransmissionLines','Status'),('AssetComponents','PowerLineId'),('AssetComponents','ManagementUnitId'),('AssetComponents','Location'),('MissionTargets','AssetId'),('MissionTargets','InspectionStatus'),('MissionTargets','CreatedAt'),('MissionTargets','IsDeleted'),('InspectionMedia','TowerId'),('InspectionMedia','CaptureLocation')) AS expected(table_name,column_name) JOIN information_schema.columns actual USING (table_name,column_name) WHERE actual.table_schema='public';")"
              GIS_LEGACY_COUNT="$(db_scalar "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND ((table_name='MissionTargets' AND column_name='TowerId') OR (table_name='Assets'));")"
              if [ "$GIS_TABLE_COUNT" = "0" ] && [ "$GIS_COLUMN_COUNT" = "0" ]; then
                echo "GIS schema is absent; EF will apply $GIS_MIGRATION_ID normally."
              elif [ "$GIS_TABLE_COUNT" = "3" ] && [ "$GIS_COLUMN_COUNT" = "16" ] && [ "$GIS_LEGACY_COUNT" = "0" ]; then
                record_existing_migration "$GIS_MIGRATION_ID"
              else
                echo "ERROR: GIS migration history is absent and its schema is incomplete (tables=$GIS_TABLE_COUNT/3, columns=$GIS_COLUMN_COUNT/16, legacy_markers=$GIS_LEGACY_COUNT)."
                echo "Reconcile the production GIS schema before applying MF01; no history row was written."
                exit 1
              fi
            fi

            UNIFY_MIGRATION_ID="20260905090000_UnifyInspectionAiFlow"
            if [ "$(migration_applied "$UNIFY_MIGRATION_ID")" != "t" ]; then
              OUTBOX_EXISTS="$(db_scalar "SELECT to_regclass('public.\"OutboxMessages\"') IS NOT NULL;")"
              OUTBOX_COLUMN_COUNT="$(db_scalar "SELECT count(*) FROM (VALUES ('Id'),('MessageType'),('Payload'),('OccurredAt'),('PublishedAt'),('Attempts'),('LastError'),('CreatedAt'),('UpdatedAt'),('CreatedBy'),('UpdatedBy'),('IsDeleted'),('DeletedAt')) AS expected(column_name) JOIN information_schema.columns actual USING (column_name) WHERE actual.table_schema='public' AND actual.table_name='OutboxMessages';")"
              UNIFY_COLUMN_COUNT="$(db_scalar "SELECT count(*) FROM (VALUES ('InspectionMedia','UploadedBy'),('AIAnalysisRequests','SourceEventId'),('AIAnalysisRequests','AssetId'),('AIAnalysisRequests','ModelName')) AS expected(table_name,column_name) JOIN information_schema.columns actual USING (table_name,column_name) WHERE actual.table_schema='public';")"
              if [ "$OUTBOX_EXISTS" = "f" ] && [ "$UNIFY_COLUMN_COUNT" = "0" ]; then
                echo "Inspection/AI schema is absent; EF will apply $UNIFY_MIGRATION_ID normally."
              elif [ "$OUTBOX_EXISTS" = "t" ] && [ "$OUTBOX_COLUMN_COUNT" = "13" ]; then
                echo "Completing additive inspection/AI schema before reconciling migration history."
                docker exec uavpms-db psql -X -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c "ALTER TABLE public.\"InspectionMedia\" ADD COLUMN IF NOT EXISTS \"UploadedBy\" uuid NULL; ALTER TABLE public.\"AIAnalysisRequests\" ADD COLUMN IF NOT EXISTS \"SourceEventId\" uuid NULL; ALTER TABLE public.\"AIAnalysisRequests\" ADD COLUMN IF NOT EXISTS \"AssetId\" uuid NULL; ALTER TABLE public.\"AIAnalysisRequests\" ADD COLUMN IF NOT EXISTS \"ModelName\" varchar(100) NOT NULL DEFAULT 'SERVER';"
                docker exec uavpms-db psql -X -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'CREATE INDEX IF NOT EXISTS "IX_OutboxMessages_MessageType_OccurredAt" ON public."OutboxMessages" ("MessageType", "OccurredAt") WHERE "PublishedAt" IS NULL AND "IsDeleted" = false; CREATE INDEX IF NOT EXISTS "IX_InspectionMedia_UploadedBy" ON public."InspectionMedia" ("UploadedBy"); CREATE UNIQUE INDEX IF NOT EXISTS "IX_AIAnalysisRequests_SourceEventId" ON public."AIAnalysisRequests" ("SourceEventId") WHERE "SourceEventId" IS NOT NULL; CREATE INDEX IF NOT EXISTS "IX_AIAnalysisRequests_AssetId" ON public."AIAnalysisRequests" ("AssetId"); CREATE UNIQUE INDEX IF NOT EXISTS "IX_AIAnalysisRequests_ActiveLogicalAnalysis" ON public."AIAnalysisRequests" ("MediaId", "AnalysisType", "ModelName") WHERE "MediaId" IS NOT NULL AND "IsDeleted" = false AND "Status" IN (0, 1); CREATE UNIQUE INDEX IF NOT EXISTS "IX_DetectedAnomalies_MediaId_AiDetectionId" ON public."DetectedAnomalies" ("MediaId", "AiDetectionId") WHERE "AiDetectionId" IS NOT NULL AND "IsDeleted" = false;'
                if [ "$(db_scalar "SELECT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='FK_InspectionMedia_Users_UploadedBy');")" != "t" ]; then
                  docker exec uavpms-db psql -X -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'ALTER TABLE public."InspectionMedia" ADD CONSTRAINT "FK_InspectionMedia_Users_UploadedBy" FOREIGN KEY ("UploadedBy") REFERENCES public."Users" ("Id") ON DELETE RESTRICT;'
                fi
                if [ "$(db_scalar "SELECT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='FK_AIAnalysisRequests_AssetComponents_AssetId');")" != "t" ]; then
                  docker exec uavpms-db psql -X -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'ALTER TABLE public."AIAnalysisRequests" ADD CONSTRAINT "FK_AIAnalysisRequests_AssetComponents_AssetId" FOREIGN KEY ("AssetId") REFERENCES public."AssetComponents" ("Id") ON DELETE RESTRICT;'
                fi
                UNIFY_COLUMN_COUNT="$(db_scalar "SELECT count(*) FROM (VALUES ('InspectionMedia','UploadedBy'),('AIAnalysisRequests','SourceEventId'),('AIAnalysisRequests','AssetId'),('AIAnalysisRequests','ModelName')) AS expected(table_name,column_name) JOIN information_schema.columns actual USING (table_name,column_name) WHERE actual.table_schema='public';")"
                if [ "$UNIFY_COLUMN_COUNT" != "4" ]; then
                  echo "ERROR: inspection/AI prerequisite repair did not produce all required columns ($UNIFY_COLUMN_COUNT/4)."
                  exit 1
                fi
                record_existing_migration "$UNIFY_MIGRATION_ID"
              else
                echo "ERROR: OutboxMessages exists but is incomplete ($OUTBOX_COLUMN_COUNT/13 columns); refusing automatic repair."
                exit 1
              fi
            fi

            SCOPE_MIGRATION_ID="20260906090000_AddUserGeographicScopes"
            if [ "$(migration_applied "$SCOPE_MIGRATION_ID")" != "t" ]; then
              SCOPE_MARKER_COUNT="$(db_scalar "SELECT (CASE WHEN to_regclass('public.\"UserGeographicScopes\"') IS NULL THEN 0 ELSE 1 END) + (SELECT count(*) FROM (VALUES ('UserGeographicScopes','UserId'),('UserGeographicScopes','RegionId'),('UserGeographicScopes','SubstationId'),('UserGeographicScopes','TransmissionLineId'),('UserGeographicScopes','ManagementUnitId')) AS expected(table_name,column_name) JOIN information_schema.columns actual USING (table_name,column_name) WHERE actual.table_schema='public');")"
              if [ "$SCOPE_MARKER_COUNT" = "6" ]; then
                record_existing_migration "$SCOPE_MIGRATION_ID"
              elif [ "$SCOPE_MARKER_COUNT" != "0" ]; then
                echo "ERROR: geographic-scope prerequisite schema is partial ($SCOPE_MARKER_COUNT/6 markers); refusing migration-history reconciliation."
                exit 1
              fi
            fi

            echo "========== NON-DESTRUCTIVE REGION AUDIT =========="
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c \
              "SELECT \"Id\", \"Code\", \"RegionName\" FROM \"Regions\" WHERE lower(trim(\"Code\")) IN ('north','central','south') OR lower(trim(\"RegionName\")) IN ('north','central','south','miền bắc','miền trung','miền nam') ORDER BY \"Code\";"
            echo "The workflow does not rename or delete Region rows. Review any rows printed above manually."

            ALREADY_APPLIED="$(docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc "SELECT EXISTS (SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$MIGRATION_ID');")"
            echo "Migration already applied: $ALREADY_APPLIED"

            if [ "$ALREADY_APPLIED" != "t" ]; then
              echo "========== APPLYING MF01 MIGRATION =========="
              migration_mode_started=true
              RUN_MIGRATIONS=true docker compose up -d --build --force-recreate operationsservice

              APPLIED_AFTER_START=false
              for attempt in $(seq 1 60); do
                APPLIED_AFTER_START="$(migration_applied "$MIGRATION_ID")"
                if [ "$APPLIED_AFTER_START" = "t" ]; then
                  echo "MF01 migration recorded after startup check $attempt."
                  break
                fi
                CONTAINER_STATUS="$(docker inspect uav-operations-service --format '{{.State.Status}}' 2>/dev/null || true)"
                if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
                  echo "ERROR: OperationsService stopped while applying MF01 migration (status: $CONTAINER_STATUS)."
                  docker compose logs --tail=200 operationsservice
                  exit 1
                fi
                sleep 2
              done

              if [ "$APPLIED_AFTER_START" != "t" ]; then
                echo "ERROR: MF01 migration was not recorded within 120 seconds."
                docker compose logs --tail=200 operationsservice
                exit 1
              fi
            fi

            echo "Restoring normal OperationsService configuration..."
            RUN_MIGRATIONS=false docker compose up -d --force-recreate operationsservice
            migration_mode_started=false

            echo "========== MF01 SCHEMA VERIFICATION =========="
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c \
              "SELECT \"MigrationId\" FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$MIGRATION_ID';"

            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c \
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('InspectionSchedules','MissionAssignments','MissionCheckIns','DroneHandovers') ORDER BY table_name;"

            TABLE_COUNT="$(docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('InspectionSchedules','MissionAssignments','MissionCheckIns','DroneHandovers');")"
            if [ "$TABLE_COUNT" != "4" ]; then
              echo "ERROR: expected 4 MF01 lifecycle tables, found $TABLE_COUNT."
              exit 1
            fi

            COLUMN_COUNT="$(docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='Missions' AND column_name IN ('RegionId','ScheduleId','MissionType','TriggerReason','PlannedStart','PlannedEnd','Boundary','Version');")"
            if [ "$COLUMN_COUNT" != "8" ]; then
              echo "ERROR: expected 8 MF01 mission columns, found $COLUMN_COUNT."
              exit 1
            fi

            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c \
              "SELECT \"Status\", count(*) FROM \"Missions\" GROUP BY \"Status\" ORDER BY \"Status\";"
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c \
              'SELECT count(*) AS legacy_missions_without_region FROM "Missions" WHERE "RegionId" IS NULL;'

            echo "========== OPERATIONS SERVICE HEALTH =========="
            for attempt in $(seq 1 30); do
              if docker inspect uav-operations-service --format '{{.State.Running}}' | grep -qx true; then
                break
              fi
              sleep 2
            done
            docker inspect uav-operations-service --format '{{.State.Running}}' | grep -qx true
            docker compose logs --tail=120 operationsservice
            echo "MF01 mission lifecycle migration verified successfully."
