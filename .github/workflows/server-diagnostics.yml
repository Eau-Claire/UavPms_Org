name: Read-only Server Diagnostics

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Optional Docker Compose service to inspect"
        required: false
        type: string
        default: ""

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Inspect deployment server
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Collect read-only diagnostics over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GATEWAY_HEALTH_URL: ${{ secrets.GATEWAY_HEALTH_URL }}
          DIAGNOSTIC_SERVICE: ${{ inputs.service }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH,GATEWAY_HEALTH_URL,DIAGNOSTIC_SERVICE
          script_stop: true
          script: |
            set -u

            cd "$DEPLOY_PATH"

            echo "========== GIT =========="
            git status --short 2>&1 || true
            git rev-parse HEAD 2>&1 || true
            git log -1 --oneline 2>&1 || true

            echo "========== DOCKER COMPOSE =========="
            docker compose ps 2>&1 || true

            echo "========== CONTAINERS =========="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1 || true

            echo "========== FAILED / RESTARTING =========="
            docker ps -a --filter status=exited 2>&1 || true
            docker ps -a --filter status=restarting 2>&1 || true

            echo "========== SERVICE STATES =========="
            docker inspect uav-ai-inspection-service \
              --format 'Name={{.Name}} ExitCode={{.State.ExitCode}} Error={{.State.Error}} OOMKilled={{.State.OOMKilled}} Status={{.State.Status}}' \
              2>&1 || true
            docker inspect uav-operations-service \
              --format 'Name={{.Name}} ExitCode={{.State.ExitCode}} Error={{.State.Error}} OOMKilled={{.State.OOMKilled}} Status={{.State.Status}}' \
              2>&1 || true

            echo "========== HEALTH =========="
            if [ -n "$GATEWAY_HEALTH_URL" ]; then
              curl -fsS -i "$GATEWAY_HEALTH_URL" 2>&1 || true
            else
              echo "GATEWAY_HEALTH_URL is not configured."
            fi

            echo "========== DISK =========="
            df -h 2>&1 || true

            echo "========== MEMORY =========="
            free -h 2>&1 || true

            echo "========== LOGS =========="
            if [ -z "$DIAGNOSTIC_SERVICE" ]; then
              docker compose logs --tail=200 2>&1 || true
            else
              COMPOSE_SERVICES="$(docker compose config --services 2>&1 || true)"
              if printf '%s\n' "$COMPOSE_SERVICES" | grep -F -x -- "$DIAGNOSTIC_SERVICE" >/dev/null 2>&1; then
                docker compose logs --tail=300 "$DIAGNOSTIC_SERVICE" 2>&1 || true
              else
                echo "Invalid service requested: $DIAGNOSTIC_SERVICE"
                echo "Allowed services:"
                printf '%s\n' "$COMPOSE_SERVICES"
              fi
            fi

            echo "========== AI INSPECTION LOGS =========="
            docker compose logs --tail=300 aiinspectionservice 2>&1 || true

            echo "========== OPERATIONS LOGS =========="
            docker compose logs --tail=300 operationsservice 2>&1 || true
