name: Production Database Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Database maintenance operation
        required: true
        type: choice
        options:
          - ensure-outbox-table

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Ensure OutboxMessages table
    if: ${{ inputs.operation == 'ensure-outbox-table' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Ensure OutboxMessages table over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            CONTAINER_STATUS="$(docker inspect uavpms-db --format '{{.State.Status}}')"
            if [ "$CONTAINER_STATUS" != "running" ]; then
              echo "ERROR: uavpms-db is not running (status: $CONTAINER_STATUS)."
              exit 1
            fi

            echo "========== DATABASE CONNECTIVITY =========="
            docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -tAc 'SELECT 1;' >/dev/null
            echo "Database uavpms is reachable."

            echo "========== CURRENT TABLE STATE =========="
            TABLE_EXISTS="$(docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -tAc 'SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_name = '\''OutboxMessages'\'');')"
            echo "public.OutboxMessages exists: $TABLE_EXISTS"

            if [ "$TABLE_EXISTS" = "t" ]; then
              echo "OutboxMessages already exists; no database change is required."
            else
              echo "Creating only public.OutboxMessages..."
              docker exec -i uavpms-db psql \
                -v ON_ERROR_STOP=1 \
                -U uavpms \
                -d uavpms <<'SQL'
            CREATE TABLE IF NOT EXISTS public."OutboxMessages" (
                "Id" uuid NOT NULL,
                "MessageType" character varying(256) NOT NULL,
                "Payload" jsonb NOT NULL,
                "OccurredAt" timestamp with time zone NOT NULL,
                "PublishedAt" timestamp with time zone NULL,
                "Attempts" integer NOT NULL,
                "LastError" text NULL,
                "CreatedAt" timestamp with time zone NOT NULL,
                "UpdatedAt" timestamp with time zone NULL,
                "CreatedBy" uuid NULL,
                "UpdatedBy" uuid NULL,
                "IsDeleted" boolean NOT NULL,
                "DeletedAt" timestamp with time zone NULL,
                CONSTRAINT "PK_OutboxMessages" PRIMARY KEY ("Id")
            );

            CREATE INDEX IF NOT EXISTS "IX_OutboxMessages_MessageType_OccurredAt"
                ON public."OutboxMessages" ("MessageType", "OccurredAt")
                WHERE "PublishedAt" IS NULL AND "IsDeleted" = false;
            SQL
              echo "OutboxMessages creation completed."
            fi

            echo "========== FINAL VERIFICATION =========="
            docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -c 'SELECT to_regclass('\''public."OutboxMessages"'\'') AS table_name;'

            echo "--- columns ---"
            docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -c 'SELECT column_name, data_type, udt_name, is_nullable FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''OutboxMessages'\'' ORDER BY ordinal_position;'

            echo "--- primary key ---"
            docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -c 'SELECT conname, pg_get_constraintdef(oid) FROM pg_constraint WHERE conrelid = '\''public."OutboxMessages"'\''::regclass AND contype = '\''p'\'';'

            echo "--- indexes ---"
            docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -c 'SELECT indexname, indexdef FROM pg_indexes WHERE schemaname = '\''public'\'' AND tablename = '\''OutboxMessages'\'' ORDER BY indexname;'

            echo "--- row count ---"
            docker exec uavpms-db psql \
              -v ON_ERROR_STOP=1 \
              -U uavpms \
              -d uavpms \
              -c 'SELECT count(*) AS row_count FROM public."OutboxMessages";'

            echo "Production database maintenance completed successfully."
