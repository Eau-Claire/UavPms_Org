name: Run API Regression Tests

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filter keyword (e.g. pre_mission, drone_technical, mission). Leave BLANK to run all tests.'
        required: false
        default: ""
        type: string

concurrency:
  group: production-api-regression-tests
  cancel-in-progress: false

jobs:
  run-tests:
    name: Execute API Regression Tests over SSH
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Run tests on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TEST_FILTER: ${{ inputs.test_filter }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH,TEST_FILTER
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            [ -n "${DEPLOY_PATH:-}" ] || { echo "ERROR: DEPLOY_PATH is not configured."; exit 1; }
            cd "$DEPLOY_PATH"

            echo "========== 1. SYNCING REPOSITORY =========="
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo "Server checkout is at: $(git rev-parse --short HEAD)"

            echo "========== 2. STARTING API-TEST CONTAINER =========="
            docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build api-test

            echo "Waiting for api-test service to become healthy..."
            for attempt in $(seq 1 20); do
              if curl -sf http://localhost:8081/api/health >/dev/null 2>&1; then
                echo "api-test is healthy on attempt $attempt."
                break
              fi
              sleep 2
            done

            echo "========== 3. RUNNING REGRESSION TESTS =========="
            RAW_FILTER="${TEST_FILTER:-}"
            CLEAN_FILTER="$(echo "$RAW_FILTER" | xargs || echo "$RAW_FILTER")"
            LOWER_FILTER="$(echo "$CLEAN_FILTER" | tr '[:upper:]' '[:lower:]')"

            TEST_EXIT_CODE=0
            if [ -n "$CLEAN_FILTER" ] && [ "$LOWER_FILTER" != "optional" ] && [ "$LOWER_FILTER" != "none" ] && [ "$LOWER_FILTER" != "all" ] && [ "$LOWER_FILTER" != "null" ]; then
              echo "Running filtered tests (-k \"$CLEAN_FILTER\")..."
              docker exec uav-api-test pytest -v -k "$CLEAN_FILTER" || TEST_EXIT_CODE=$?
            else
              echo "Running full test suite (all 69 test cases)..."
              docker exec uav-api-test pytest -v || TEST_EXIT_CODE=$?
            fi

            echo "========== 4. LATEST TEST RUN STATUS =========="
            if command -v jq >/dev/null 2>&1; then
              curl -s http://localhost:8081/api/results | jq '.summary // .' || true
            else
              curl -s http://localhost:8081/api/results || true
            fi
            echo ""

            if [ "$TEST_EXIT_CODE" -ne 0 ]; then
              echo "Tests finished with exit code $TEST_EXIT_CODE"
              exit "$TEST_EXIT_CODE"
            fi
