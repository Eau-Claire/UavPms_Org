name: Run API Regression Tests

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filter keyword (e.g. pre_mission, drone_technical, mission). Leave BLANK to run all tests.'
        required: false
        default: ""
        type: string

concurrency:
  group: production-api-regression-tests
  cancel-in-progress: false

jobs:
  run-tests:
    name: Execute API Regression Tests over SSH
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Run tests on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TEST_FILTER: ${{ inputs.test_filter }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH,TEST_FILTER
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            [ -n "${DEPLOY_PATH:-}" ] || { echo "ERROR: DEPLOY_PATH is not configured."; exit 1; }
            cd "$DEPLOY_PATH"

            echo "========== 1. SYNCING REPOSITORY =========="
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo "Server checkout is at: $(git rev-parse --short HEAD)"

            chmod +x api-test/scripts/run_regression_suite.sh
            api-test/scripts/run_regression_suite.sh "${TEST_FILTER:-}"
