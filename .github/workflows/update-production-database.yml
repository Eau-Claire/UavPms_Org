name: Update Production Operations Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_OPERATIONS_MIGRATIONS to run pending OperationsService EF Core migrations.
        required: true
        type: string

concurrency:
  group: production-operations-database-update
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply OperationsService migrations
    if: ${{ inputs.confirmation == 'APPLY_OPERATIONS_MIGRATIONS' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Apply migrations over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail

            echo "========== DATABASE MIGRATION PREFLIGHT =========="
            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "ERROR: DEPLOY_PATH is not configured."
              exit 1
            fi
            cd "$DEPLOY_PATH"
            echo "Using deployment path: $DEPLOY_PATH"
            CURRENT_BRANCH="$(git branch --show-current)"
            echo "Current branch: $CURRENT_BRANCH"
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: deployment checkout must be on main."
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: deployment checkout has uncommitted changes."
              git status --short
              exit 1
            fi
            DB_STATUS="$(docker inspect uavpms-db --format '{{.State.Status}}')"
            echo "Database container status: $DB_STATUS"
            if [ "$DB_STATUS" != "running" ]; then
              echo "ERROR: uavpms-db is not running."
              exit 1
            fi
            echo "Applying pending OperationsService migrations..."
            RUN_MIGRATIONS=true docker compose up -d --build --force-recreate operationsservice
            echo "Waiting for OperationsService startup..."
            for attempt in $(seq 1 30); do docker inspect uav-operations-service --format '{{.State.Running}}' | grep -qx true && break; sleep 2; done
            docker inspect uav-operations-service --format '{{.State.Running}}' | grep -qx true
            echo "Restoring normal OperationsService configuration..."
            RUN_MIGRATIONS=false docker compose up -d --force-recreate operationsservice
            echo "========== MIGRATION HISTORY =========="
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId";'
            echo "========== ASSET SCHEMA =========="
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'SELECT to_regclass('\''public."AssetComponents"'\'') AS asset_components_table;'
            echo "========== OPERATIONS SERVICE LOGS =========="
            docker compose logs --tail=100 operationsservice
