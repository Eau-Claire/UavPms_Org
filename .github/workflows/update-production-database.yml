name: Update Production Operations Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_OPERATIONS_MIGRATIONS to run pending OperationsService EF Core migrations.
        required: true
        type: string

concurrency:
  group: production-operations-database-update
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply OperationsService migrations
    if: ${{ inputs.confirmation == 'APPLY_OPERATIONS_MIGRATIONS' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Apply migrations over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail

            echo "========== DATABASE MIGRATION PREFLIGHT =========="
            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "ERROR: DEPLOY_PATH is not configured."
              exit 1
            fi
            cd "$DEPLOY_PATH"
            echo "Using deployment path: $DEPLOY_PATH"
            CURRENT_BRANCH="$(git branch --show-current)"
            echo "Current branch: $CURRENT_BRANCH"
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "ERROR: deployment checkout must be on main."
              exit 1
            fi
            DIRTY_FILES="$(git status --porcelain)"
            if [ -n "$DIRTY_FILES" ]; then
              UNSAFE_FILES="$(printf '%s\n' "$DIRTY_FILES" | grep -vE '^\?\? (analysis-get\.js|benchmark_ai\.py|health\.js|monitoring/)' || true)"
              if [ -n "$UNSAFE_FILES" ]; then
                echo "ERROR: deployment checkout has unexpected changes."
                printf '%s\n' "$UNSAFE_FILES"
                exit 1
              fi
              echo "Ignoring approved diagnostic files in the deployment checkout."
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: deployment checkout has changes to tracked files."
              git status --short --untracked-files=no
              exit 1
            fi
            DB_STATUS="$(docker inspect uavpms-db --format '{{.State.Status}}')"
            echo "Database container status: $DB_STATUS"
            if [ "$DB_STATUS" != "running" ]; then
              echo "ERROR: uavpms-db is not running."
              exit 1
            fi
            ERD_V2_2_APPLIED="$(docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc "SELECT EXISTS (SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '20261027181344_AlignSchemaWithErdV2_2');")"
            if [ "$ERD_V2_2_APPLIED" != "t" ]; then
              echo "ERROR: ERD v2.2 migration is absent from history."
              echo "Run 'Migrate Database (ERD v2.2)' first (it takes a backup and handles data conversion)."
              exit 1
            fi
            # Migrations come from the deployment checkout, so it must already be at origin/main (run Deploy first).
            git fetch --quiet origin main
            DEPLOYED="$(git rev-parse HEAD)"
            LATEST="$(git rev-parse origin/main)"
            echo "Deployment checkout: $(git log -1 --format='%h %s' "$DEPLOYED")"
            if [ "$DEPLOYED" != "$LATEST" ]; then
              echo "ERROR: deployment checkout is not at origin/main ($(git log -1 --format='%h %s' "$LATEST"))."
              echo "Run the Deploy workflow for the latest commit first, then re-run this workflow."
              exit 1
            fi
            MIGRATIONS_DIR="Services/OperationsService/UavPms.OperationsService.Infrastructure/Migrations"
            CODE_MIGRATIONS="$(ls "$MIGRATIONS_DIR" | grep -E '^[0-9]{14}_.*\.cs$' | grep -v '\.Designer\.cs$' | sed 's/\.cs$//' | LC_ALL=C sort)"
            applied_migrations() {
              docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -tAc 'SELECT "MigrationId" FROM "__EFMigrationsHistory"' | LC_ALL=C sort
            }
            PENDING="$(LC_ALL=C comm -23 <(printf '%s\n' "$CODE_MIGRATIONS") <(applied_migrations))"
            if [ -z "$PENDING" ]; then
              echo "No pending OperationsService migrations. Nothing to do."
              exit 0
            fi
            echo "Pending migrations:"
            printf '  %s\n' $PENDING

            echo "========== BACKUP =========="
            STAMP="$(date -u +%Y%m%d%H%M%S)"
            mkdir -p "$DEPLOY_PATH/backups"
            BACKUP="$DEPLOY_PATH/backups/uavpms_before_migrations_${STAMP}.dump"
            docker exec uavpms-db pg_dump -U uavpms -d uavpms -Fc -f "/tmp/backup_${STAMP}.dump"
            docker cp "uavpms-db:/tmp/backup_${STAMP}.dump" "$BACKUP"
            docker exec uavpms-db rm -f "/tmp/backup_${STAMP}.dump"
            echo "Backup written to $BACKUP ($(du -h "$BACKUP" | cut -f1))"

            echo "========== APPLYING MIGRATIONS =========="
            docker compose build operationsservice
            # One-off container in migration-only mode: blocks until Database.Migrate() returns and exits non-zero
            # (failing this job) when a migration throws, e.g. "Users has duplicate Email values".
            RUN_MIGRATIONS=true MIGRATION_ONLY=true docker compose run --rm --no-deps operationsservice

            echo "========== MIGRATION HISTORY =========="
            docker exec uavpms-db psql -v ON_ERROR_STOP=1 -U uavpms -d uavpms -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId" DESC LIMIT 5;'
            STILL_PENDING="$(LC_ALL=C comm -23 <(printf '%s\n' "$CODE_MIGRATIONS") <(applied_migrations))"
            if [ -n "$STILL_PENDING" ]; then
              echo "ERROR: migrations still missing from history:"
              printf '  %s\n' $STILL_PENDING
              exit 1
            fi

            echo "Restarting OperationsService with the new image..."
            RUN_MIGRATIONS=false MIGRATION_ONLY=false docker compose up -d --force-recreate operationsservice
            echo "========== OPERATIONS SERVICE LOGS =========="
            sleep 15
            docker compose logs --tail=50 operationsservice
