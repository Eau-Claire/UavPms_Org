name: Cleanup Duplicate Users

# Manual only. Runs scripts/db/cleanup_duplicate_users.sql against the production database so the
# UNIQUE indexes IX_Users_Email / IX_Users_Phone can be created (migration AddUsersEmailPhoneUniqueIndexes).
#
#   mode = dry-run : print the duplicate groups and what would change, then roll back.
#   mode = apply   : backup + same script, committed.
#
# Rollback: restore the backup printed in the job log (pg_restore inside the uavpms-db container).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run (report only) or apply (commit changes)
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirmation:
        description: Type CLEANUP_DUPLICATE_USERS to confirm
        required: true
        type: string

concurrency:
  group: production-operations-database-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  DB_CONTAINER: uavpms-db
  DB_USER: uavpms
  DB_NAME: uavpms

jobs:
  cleanup:
    name: Cleanup duplicate users (${{ inputs.mode }})
    if: ${{ inputs.confirmation == 'CLEANUP_DUPLICATE_USERS' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: scripts/db/cleanup_duplicate_users.sql
          target: /tmp/uavpms-cleanup-users-${{ github.run_id }}
          strip_components: 2

      - name: Run cleanup
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MODE: ${{ inputs.mode }}
          SCRIPT_DIR: /tmp/uavpms-cleanup-users-${{ github.run_id }}
          DB_CONTAINER: ${{ env.DB_CONTAINER }}
          DB_USER: ${{ env.DB_USER }}
          DB_NAME: ${{ env.DB_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 15m
          envs: DEPLOY_PATH,MODE,SCRIPT_DIR,DB_CONTAINER,DB_USER,DB_NAME
          script_stop: true
          script: |
            set -euo pipefail
            SCRIPT="$SCRIPT_DIR/cleanup_duplicate_users.sql"
            STAMP="$(date -u +%Y%m%d%H%M%S)"
            test -n "${DEPLOY_PATH:-}" || { echo "ERROR: DEPLOY_PATH is not configured."; exit 1; }
            test -s "$SCRIPT" || { echo "ERROR: script not found at $SCRIPT"; exit 1; }
            [ "$(docker inspect "$DB_CONTAINER" --format '{{.State.Status}}')" = "running" ] || { echo "ERROR: $DB_CONTAINER is not running."; exit 1; }

            APPLY=false
            if [ "$MODE" = "apply" ]; then
              APPLY=true
              echo "========== BACKUP =========="
              BACKUP_DIR="$DEPLOY_PATH/backups"
              mkdir -p "$BACKUP_DIR"
              BACKUP="$BACKUP_DIR/${DB_NAME}_before_user_cleanup_${STAMP}.dump"
              docker exec "$DB_CONTAINER" pg_dump -U "$DB_USER" -d "$DB_NAME" -Fc -f "/tmp/backup_${STAMP}.dump"
              docker cp "$DB_CONTAINER:/tmp/backup_${STAMP}.dump" "$BACKUP"
              docker exec "$DB_CONTAINER" rm -f "/tmp/backup_${STAMP}.dump"
              echo "Backup written to $BACKUP ($(du -h "$BACKUP" | cut -f1))"
            fi

            echo "========== CLEANUP (mode: $MODE) =========="
            docker cp "$SCRIPT" "$DB_CONTAINER:/tmp/cleanup_duplicate_users_${STAMP}.sql"
            STATUS=0
            docker exec "$DB_CONTAINER" psql -X -v ON_ERROR_STOP=1 -v apply="$APPLY" -U "$DB_USER" -d "$DB_NAME" \
              -f "/tmp/cleanup_duplicate_users_${STAMP}.sql" || STATUS=$?
            docker exec "$DB_CONTAINER" rm -f "/tmp/cleanup_duplicate_users_${STAMP}.sql"
            rm -rf "$SCRIPT_DIR"
            exit "$STATUS"
